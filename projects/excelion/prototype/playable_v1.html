<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Excelion Playable V1 — Montu Charge</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #0d1117; color: #e6edf3; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px; }
  h1 { font-size: 1rem; font-weight: 600; margin-bottom: 8px; opacity: 0.9; }
  #hud { width: 800px; max-width: 100%; display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; font-size: 13px; }
  #reason { color: #f85149; min-height: 1.2em; font-weight: 600; }
  canvas { background: #161b22; border: 1px solid #30363d; border-radius: 6px; max-width: 100%; touch-action: none; }
  #help { width: 800px; max-width: 100%; margin-top: 10px; font-size: 12px; color: #8b949e; line-height: 1.5; }
  button { margin: 4px 4px 0 0; padding: 6px 12px; background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 4px; cursor: pointer; }
  button:hover { background: #30363d; }
  button.active { border-color: #58a6ff; color: #58a6ff; }
</style>
</head>
<body>
<h1>Excelion · Playable V1 — 몬투 직선 돌진</h1>
<div id="hud">
  <span id="hp">HP —</span>
  <span id="scenario">Scenario 1</span>
  <span id="attempts">재도전 0</span>
</div>
<div id="reason"></div>
<canvas id="c" width="800" height="480"></canvas>
<div>
  <button type="button" id="s1" class="active">Scenario 1 (몬투 1)</button>
  <button type="button" id="s2">Scenario 2 (몬투 2)</button>
  <button type="button" id="restart">재도전 (R)</button>
</div>
<div id="help">
  <b>조작</b> WASD/방향키 이동 · Space/Shift 대시(무적) · 클릭 또는 J 공격<br/>
  <b>목표</b> 경고(노란 선) 후 돌진을 대시로 피한다. 맞으면 실패 원인이 표시된다.<br/>
  더미 자산 · 애니 없음(스케일/깜빡임/색) · 고퀄 모델링 없음
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const keys = {};
  let scenario = 1;
  let attempts = 0;
  let lastDeath = '';
  let shake = 0;
  let gameOver = false;
  let win = false;

  const player = {
    x: W * 0.25, y: H * 0.5, r: 14,
    hp: 100, maxHp: 100,
    speed: 220,
    dashT: 0, dashCd: 0, invuln: 0,
    flash: 0, facing: 1,
  };

  function makeMontu(x, y, phaseOff = 0) {
    return {
      x, y, r: 22,
      vx: 0, vy: 0,
      state: 'idle', // idle | telegraph | charge | recover
      timer: 0.6 + phaseOff,
      chargeCount: 0,
      aimX: 0, aimY: 0,
      flash: 0,
      scale: 1,
      alive: true,
      speedMul: 1,
    };
  }

  let bosses = [];

  function resetRun(keepAttempts) {
    if (!keepAttempts) attempts = 0;
    gameOver = false;
    win = false;
    lastDeath = '';
    document.getElementById('reason').textContent = '';
    player.x = W * 0.25;
    player.y = H * 0.5;
    player.hp = player.maxHp;
    player.dashT = 0;
    player.dashCd = 0;
    player.invuln = 0;
    player.flash = 0;
    if (scenario === 1) {
      bosses = [makeMontu(W * 0.72, H * 0.5)];
    } else {
      bosses = [
        makeMontu(W * 0.7, H * 0.32, 0),
        makeMontu(W * 0.78, H * 0.68, 0.9),
      ];
    }
    updateHud();
  }

  function updateHud() {
    document.getElementById('hp').textContent = `HP ${Math.max(0, player.hp | 0)}`;
    document.getElementById('scenario').textContent = `Scenario ${scenario}`;
    document.getElementById('attempts').textContent = `재도전 ${attempts}`;
  }

  function die(reason) {
    if (gameOver) return;
    gameOver = true;
    lastDeath = reason;
    document.getElementById('reason').textContent = reason;
    attempts += 1;
    updateHud();
  }

  function hitPlayer(dmg, reason) {
    if (player.invuln > 0 || gameOver) return;
    player.hp -= dmg;
    player.flash = 0.15;
    shake = 0.25;
    if (player.hp <= 0) die(reason);
    else updateHud();
  }

  function attackBosses() {
    for (const b of bosses) {
      if (!b.alive) continue;
      const dx = b.x - player.x, dy = b.y - player.y;
      if (dx * dx + dy * dy < (player.r + b.r + 18) ** 2) {
        b.flash = 0.12;
        b.scale = 0.92;
        // soft damage not required for V1 clear; optional pressure
      }
    }
  }

  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (e.code === 'KeyR') resetRun(true);
    if (e.code === 'KeyJ' || e.code === 'KeyZ') attackBosses();
    if (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
      e.preventDefault();
      tryDash();
    }
  });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });
  canvas.addEventListener('mousedown', () => attackBosses());

  document.getElementById('s1').onclick = () => {
    scenario = 1;
    document.getElementById('s1').classList.add('active');
    document.getElementById('s2').classList.remove('active');
    resetRun(false);
  };
  document.getElementById('s2').onclick = () => {
    scenario = 2;
    document.getElementById('s2').classList.add('active');
    document.getElementById('s1').classList.remove('active');
    resetRun(false);
  };
  document.getElementById('restart').onclick = () => resetRun(true);

  function tryDash() {
    if (gameOver || player.dashCd > 0 || player.dashT > 0) return;
    player.dashT = 0.28;
    player.invuln = 0.32;
    player.dashCd = 0.85;
  }

  function updateBoss(b, dt) {
    if (!b.alive || gameOver) return;
    b.timer -= dt;
    if (b.flash > 0) b.flash -= dt;
    if (b.scale < 1) b.scale = Math.min(1, b.scale + dt * 2);

    // Anubis-lite: every 3 charges, speed up
    b.speedMul = 1 + Math.floor(b.chargeCount / 3) * 0.18;

    if (b.state === 'idle') {
      if (b.timer <= 0) {
        b.state = 'telegraph';
        b.timer = 0.8;
        const dx = player.x - b.x, dy = player.y - b.y;
        const len = Math.hypot(dx, dy) || 1;
        b.aimX = dx / len;
        b.aimY = dy / len;
      }
    } else if (b.state === 'telegraph') {
      if (b.timer <= 0) {
        b.state = 'charge';
        b.timer = 0.55 / b.speedMul;
        const spd = 520 * b.speedMul;
        b.vx = b.aimX * spd;
        b.vy = b.aimY * spd;
        b.scale = 1.12;
      }
    } else if (b.state === 'charge') {
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      // hit player during charge
      const dx = player.x - b.x, dy = player.y - b.y;
      if (dx * dx + dy * dy < (player.r + b.r) ** 2) {
        const reason = player.dashT > 0
          ? '위치 선정 실패'
          : '회피 타이밍 실패';
        hitPlayer(34, reason);
      }
      const margin = b.r + 8;
      if (b.x < margin || b.x > W - margin || b.y < margin || b.y > H - margin || b.timer <= 0) {
        b.x = Math.max(margin, Math.min(W - margin, b.x));
        b.y = Math.max(margin, Math.min(H - margin, b.y));
        b.state = 'recover';
        b.timer = 0.7;
        b.vx = b.vy = 0;
        b.chargeCount += 1;
        b.scale = 1;
      }
    } else if (b.state === 'recover') {
      if (b.timer <= 0) {
        b.state = 'idle';
        b.timer = 0.5 + Math.random() * 0.4;
      }
    }
  }

  function update(dt) {
    if (shake > 0) shake -= dt;

    if (!gameOver) {
      let mx = 0, my = 0;
      if (keys['KeyW'] || keys['ArrowUp']) my -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) my += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
      if (mx || my) {
        const len = Math.hypot(mx, my);
        mx /= len; my /= len;
        player.facing = mx >= 0 ? 1 : -1;
        const sp = player.speed * (player.dashT > 0 ? 2.4 : 1);
        player.x += mx * sp * dt;
        player.y += my * sp * dt;
      }
      player.x = Math.max(player.r, Math.min(W - player.r, player.x));
      player.y = Math.max(player.r, Math.min(H - player.r, player.y));

      if (player.dashT > 0) player.dashT -= dt;
      if (player.dashCd > 0) player.dashCd -= dt;
      if (player.invuln > 0) player.invuln -= dt;
      if (player.flash > 0) player.flash -= dt;

      for (const b of bosses) updateBoss(b, dt);

      // soft win: survive 45s
      // tracked via charge counts optional — V1 is learn loop; win not required
    }
  }

  function drawPlayer() {
    ctx.save();
    if (player.invuln > 0 && (player.invuln * 20 | 0) % 2 === 0) ctx.globalAlpha = 0.45;
    // body 3-tone
    ctx.fillStyle = player.flash > 0 ? '#ff6b6b' : '#7ec8ff';
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#3a7ca5';
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r * 0.55, 0, Math.PI * 2);
    ctx.fill();
    // facing arrow
    ctx.fillStyle = '#e8f4ff';
    ctx.beginPath();
    const f = player.facing;
    ctx.moveTo(player.x + f * (player.r + 6), player.y);
    ctx.lineTo(player.x + f * (player.r - 2), player.y - 7);
    ctx.lineTo(player.x + f * (player.r - 2), player.y + 7);
    ctx.fill();
    ctx.restore();
  }

  function drawBoss(b) {
    if (!b.alive) return;
    // telegraph line
    if (b.state === 'telegraph') {
      ctx.strokeStyle = 'rgba(255, 200, 40, 0.85)';
      ctx.lineWidth = 4;
      ctx.setLineDash([10, 8]);
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x + b.aimX * 900, b.y + b.aimY * 900);
      ctx.stroke();
      ctx.setLineDash([]);
      // danger wedge hint
      ctx.fillStyle = 'rgba(255, 80, 60, 0.12)';
      ctx.beginPath();
      ctx.arc(b.x, b.y, 80, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.scale(b.scale, b.scale);
    const attacking = b.state === 'charge' || b.state === 'telegraph';
    ctx.fillStyle = b.flash > 0 ? '#ff8866' : (attacking ? '#c44' : '#3d4450');
    // box body
    ctx.fillRect(-18, -20, 36, 40);
    // arms
    ctx.fillStyle = attacking ? '#e55' : '#2a3038';
    ctx.fillRect(-28, -8, 12, 16);
    ctx.fillRect(16, -8, 12, 16);
    // head direction
    ctx.fillStyle = '#9aa3ad';
    ctx.fillRect(-8, -28, 16, 10);
    ctx.restore();
  }

  function draw() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
    }
    ctx.clearRect(-10, -10, W + 20, H + 20);
    // floor grid
    ctx.strokeStyle = '#21262d';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    for (const b of bosses) drawBoss(b);
    drawPlayer();

    if (gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#f85149';
      ctx.font = 'bold 22px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(lastDeath || '실패', W / 2, H / 2 - 12);
      ctx.fillStyle = '#e6edf3';
      ctx.font = '14px system-ui';
      ctx.fillText('R 또는 재도전 버튼', W / 2, H / 2 + 16);
    }
    ctx.restore();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  resetRun(false);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
