<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Excelion Playable V2 — Experience Density</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #0d1117; color: #e6edf3; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; }
  h1 { font-size: 0.95rem; margin-bottom: 6px; opacity: 0.9; }
  #wrap { position: relative; width: 800px; max-width: 100%; }
  canvas { display: block; width: 100%; background: #161b22; border: 1px solid #30363d; border-radius: 6px; touch-action: none; }
  #overlay { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 10px 12px; }
  .bars { display: flex; flex-direction: column; gap: 4px; }
  .bar-row { display: flex; align-items: center; gap: 8px; font-size: 11px; }
  .bar-bg { flex: 1; height: 8px; background: #21262d; border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.05s; }
  #php { background: #3fb950; }
  #bhp { background: #f85149; }
  #dash { background: #58a6ff; }
  #banner { text-align: center; font-size: 15px; font-weight: 700; text-shadow: 0 1px 4px #000; min-height: 1.4em; }
  #reason { color: #f85149; font-size: 13px; font-weight: 600; text-align: center; min-height: 1.2em; }
  #help { width: 800px; max-width: 100%; margin-top: 8px; font-size: 12px; color: #8b949e; line-height: 1.45; }
  button { margin: 4px 4px 0 0; padding: 6px 12px; background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 4px; cursor: pointer; }
  button:hover { background: #30363d; }
</style>
</head>
<body>
<h1>Excelion · Phase 2 — 경험 밀도 (더미)</h1>
<div id="wrap">
  <canvas id="c" width="800" height="480"></canvas>
  <div id="overlay">
    <div class="bars">
      <div class="bar-row"><span>YOU</span><div class="bar-bg"><div class="bar-fill" id="php" style="width:100%"></div></div></div>
      <div class="bar-row"><span id="blabel">—</span><div class="bar-bg"><div class="bar-fill" id="bhp" style="width:0%"></div></div></div>
      <div class="bar-row"><span>DASH</span><div class="bar-bg"><div class="bar-fill" id="dash" style="width:100%"></div></div></div>
    </div>
    <div>
      <div id="banner"></div>
      <div id="reason"></div>
    </div>
  </div>
</div>
<div>
  <button type="button" id="restart">재도전 (R)</button>
</div>
<div id="help">
  <b>조작</b> WASD 이동 · Space/Shift 대시 · J/클릭 공격<br/>
  <b>스테이지</b> 몬투×3 → Fast/Fake → <b>ANUBIS</b> → Clear<br/>
  Fast=짧은 경고 · Fake=페인트 후 딜레이 · Anubis=3연 돌진+방향 전환+페이즈
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = 800, H = 480;
  const keys = {};
  let shake = 0, hitstop = 0, flashRed = 0, flashWhite = 0;
  let bannerT = 0, bannerText = '';
  let gameOver = false, cleared = false, attempts = 0;
  let lastDeath = '';
  let wave = 0; // 0 intro, 1 montu3, 2 variants, 3 anubis, 4 clear
  let enemies = [];
  let stageTime = 0;

  const player = {
    x: 180, y: H / 2, r: 14, hp: 100, maxHp: 100,
    speed: 230, dashT: 0, dashCd: 0, invuln: 0, facing: 1, flash: 0,
  };

  function showBanner(t, sec = 1.4) {
    bannerText = t;
    bannerT = sec;
    document.getElementById('banner').textContent = t;
  }

  function setReason(t) {
    lastDeath = t;
    document.getElementById('reason').textContent = t || '';
  }

  function makeEnemy(type, x, y, opts = {}) {
    return {
      type, // montu | fast | fake | anubis
      x, y,
      r: type === 'anubis' ? 32 : 20,
      hp: opts.hp ?? (type === 'anubis' ? 280 : type === 'montu' ? 45 : 40),
      maxHp: opts.hp ?? (type === 'anubis' ? 280 : type === 'montu' ? 45 : 40),
      state: 'idle',
      timer: 0.4 + Math.random() * 0.5,
      aimX: 1, aimY: 0,
      vx: 0, vy: 0,
      scale: 1,
      flash: 0,
      chargeCount: 0,
      comboLeft: 0,
      phase: 1,
      fakeStep: 0,
      alive: true,
      speedMul: 1,
    };
  }

  function spawnWave(n) {
    enemies = [];
    if (n === 1) {
      showBanner('WAVE 1 — 몬투');
      enemies = [
        makeEnemy('montu', 620, 160),
        makeEnemy('montu', 680, 240),
        makeEnemy('montu', 620, 340),
      ];
    } else if (n === 2) {
      showBanner('WAVE 2 — Fast / Fake');
      enemies = [
        makeEnemy('fast', 650, 180),
        makeEnemy('fake', 700, 300),
      ];
    } else if (n === 3) {
      showBanner('BOSS — ANUBIS');
      enemies = [makeEnemy('anubis', 640, H / 2)];
    }
  }

  function resetRun() {
    gameOver = false;
    cleared = false;
    setReason('');
    player.x = 180; player.y = H / 2; player.hp = 100;
    player.dashT = player.dashCd = player.invuln = 0;
    wave = 1;
    stageTime = 0;
    spawnWave(1);
    updateUI();
  }

  function updateUI() {
    document.getElementById('php').style.width = `${Math.max(0, player.hp)}%`;
    const alive = enemies.filter(e => e.alive);
    const focus = alive.find(e => e.type === 'anubis') || alive[0];
    if (focus) {
      document.getElementById('blabel').textContent = focus.type.toUpperCase();
      document.getElementById('bhp').style.width = `${(100 * focus.hp) / focus.maxHp}%`;
    } else {
      document.getElementById('blabel').textContent = '—';
      document.getElementById('bhp').style.width = '0%';
    }
    const dashPct = player.dashCd <= 0 ? 100 : Math.max(0, 100 * (1 - player.dashCd / 0.85));
    document.getElementById('dash').style.width = `${dashPct}%`;
  }

  function die(reason) {
    if (gameOver || cleared) return;
    gameOver = true;
    setReason(reason);
    attempts++;
  }

  function hitPlayer(dmg, reason) {
    if (player.invuln > 0 || gameOver || cleared) return;
    player.hp -= dmg;
    player.flash = 0.12;
    flashRed = 0.12;
    shake = Math.min(1, 0.15 + dmg * 0.008);
    hitstop = 0.07;
    if (player.hp <= 0) die(reason);
    updateUI();
  }

  function damageEnemy(e, dmg) {
    if (!e.alive) return;
    e.hp -= dmg;
    e.flash = 0.1;
    e.scale = 0.88;
    flashWhite = 0.06;
    hitstop = 0.05;
    shake = 0.12;
    if (e.hp <= 0) {
      e.alive = false;
      e.state = 'dead';
    }
    updateUI();
  }

  function tryDash() {
    if (gameOver || cleared || player.dashCd > 0 || player.dashT > 0) return;
    player.dashT = 0.28;
    player.invuln = 0.34;
    player.dashCd = 0.85;
  }

  function playerAttack() {
    if (gameOver || cleared) return;
    for (const e of enemies) {
      if (!e.alive) continue;
      const dx = e.x - player.x, dy = e.y - player.y;
      if (dx * dx + dy * dy < (player.r + e.r + 22) ** 2) {
        damageEnemy(e, e.type === 'anubis' ? 12 : 18);
      }
    }
  }

  function aimAtPlayer(e) {
    const dx = player.x - e.x, dy = player.y - e.y;
    const len = Math.hypot(dx, dy) || 1;
    e.aimX = dx / len;
    e.aimY = dy / len;
  }

  function startCharge(e, duration, speed) {
    e.state = 'charge';
    e.timer = duration;
    e.vx = e.aimX * speed;
    e.vy = e.aimY * speed;
    e.scale = 1.15;
  }

  function updateEnemy(e, dt) {
    if (!e.alive) return;
    e.timer -= dt;
    if (e.flash > 0) e.flash -= dt;
    if (e.scale < 1) e.scale = Math.min(1, e.scale + dt * 2.5);

    // Anubis phase by HP
    if (e.type === 'anubis') {
      e.phase = e.hp < e.maxHp * 0.45 ? 2 : 1;
      e.speedMul = e.phase === 2 ? 1.25 : 1;
    }

    if (e.state === 'idle') {
      if (e.timer <= 0) {
        if (e.type === 'fake') {
          e.state = 'fake_paint';
          e.timer = 0.35;
          aimAtPlayer(e);
          e.fakeStep = 0;
        } else if (e.type === 'anubis' && e.chargeCount % 2 === 1) {
          // combo series
          e.state = 'telegraph';
          e.timer = e.phase === 2 ? 0.45 : 0.55;
          aimAtPlayer(e);
          e.comboLeft = 3;
        } else {
          e.state = 'telegraph';
          const tel = e.type === 'fast' ? 0.38 : e.type === 'anubis' ? (e.phase === 2 ? 0.5 : 0.65) : 0.8;
          e.timer = tel;
          aimAtPlayer(e);
          e.comboLeft = 0;
        }
      }
    } else if (e.state === 'fake_paint') {
      // short fake lunge telegraph then delay
      if (e.timer <= 0) {
        e.state = 'fake_wait';
        e.timer = 0.55;
      }
    } else if (e.state === 'fake_wait') {
      if (e.timer <= 0) {
        aimAtPlayer(e);
        e.state = 'telegraph';
        e.timer = 0.25;
      }
    } else if (e.state === 'telegraph') {
      if (e.timer <= 0) {
        const spd = (e.type === 'fast' ? 620 : e.type === 'anubis' ? 560 : 500) * (e.speedMul || 1);
        const dur = e.type === 'anubis' ? 0.42 : 0.5;
        startCharge(e, dur / (e.speedMul || 1), spd);
      }
    } else if (e.state === 'charge') {
      e.x += e.vx * dt;
      e.y += e.vy * dt;
      const dx = player.x - e.x, dy = player.y - e.y;
      if (dx * dx + dy * dy < (player.r + e.r) ** 2) {
        const reason = e.type === 'fake' ? '페인트 판단 실패'
          : e.type === 'fast' ? '회피 타이밍 실패'
          : e.comboLeft > 0 ? '연속 돌진 위치 실패'
          : '회피 타이밍 실패';
        hitPlayer(e.type === 'anubis' ? 28 : 22, reason);
      }
      const m = e.r + 6;
      const hitWall = e.x < m || e.x > W - m || e.y < m || e.y > H - m;
      if (hitWall || e.timer <= 0) {
        e.x = Math.max(m, Math.min(W - m, e.x));
        e.y = Math.max(m, Math.min(H - m, e.y));
        e.vx = e.vy = 0;
        e.scale = 1;
        e.chargeCount++;
        if (e.type === 'anubis' && e.comboLeft > 1) {
          e.comboLeft--;
          // redirect toward player
          aimAtPlayer(e);
          e.state = 'telegraph';
          e.timer = 0.28;
        } else {
          e.comboLeft = 0;
          e.state = 'recover';
          e.timer = e.type === 'anubis' ? 0.55 : 0.65;
        }
      }
    } else if (e.state === 'recover') {
      if (e.timer <= 0) {
        e.state = 'idle';
        e.timer = 0.35 + Math.random() * 0.35;
      }
    }
  }

  function checkWaveClear() {
    if (gameOver || cleared) return;
    if (enemies.every(e => !e.alive)) {
      if (wave === 1) { wave = 2; spawnWave(2); }
      else if (wave === 2) { wave = 3; spawnWave(3); }
      else if (wave === 3) {
        wave = 4;
        cleared = true;
        showBanner('CLEAR', 3);
        setReason('');
      }
    }
  }

  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (e.code === 'KeyR') resetRun();
    if (e.code === 'KeyJ' || e.code === 'KeyZ') playerAttack();
    if (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
      e.preventDefault();
      tryDash();
    }
  });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });
  canvas.addEventListener('mousedown', () => playerAttack());
  document.getElementById('restart').onclick = () => resetRun();

  function update(dt) {
    if (hitstop > 0) {
      hitstop -= dt;
      return; // freeze
    }
    if (shake > 0) shake -= dt;
    if (flashRed > 0) flashRed -= dt;
    if (flashWhite > 0) flashWhite -= dt;
    if (bannerT > 0) {
      bannerT -= dt;
      if (bannerT <= 0) document.getElementById('banner').textContent = cleared ? 'CLEAR' : '';
    }

    if (gameOver || cleared) return;
    stageTime += dt;

    let mx = 0, my = 0;
    if (keys['KeyW'] || keys['ArrowUp']) my -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) my += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
    if (mx || my) {
      const len = Math.hypot(mx, my);
      mx /= len; my /= len;
      player.facing = mx >= 0 ? 1 : -1;
      const sp = player.speed * (player.dashT > 0 ? 2.5 : 1);
      player.x += mx * sp * dt;
      player.y += my * sp * dt;
    }
    player.x = Math.max(player.r, Math.min(W - player.r, player.x));
    player.y = Math.max(player.r, Math.min(H - player.r, player.y));
    if (player.dashT > 0) player.dashT -= dt;
    if (player.dashCd > 0) player.dashCd -= dt;
    if (player.invuln > 0) player.invuln -= dt;
    if (player.flash > 0) player.flash -= dt;

    for (const e of enemies) updateEnemy(e, dt);
    checkWaveClear();
    updateUI();
  }

  function drawEnemy(e) {
    if (!e.alive) return;
    // telegraph
    if (e.state === 'telegraph' || e.state === 'fake_paint') {
      const col = e.state === 'fake_paint' ? 'rgba(180,180,255,0.5)' : 'rgba(255,200,40,0.9)';
      ctx.strokeStyle = col;
      ctx.lineWidth = e.type === 'fast' ? 3 : 4;
      ctx.setLineDash(e.state === 'fake_paint' ? [4, 10] : [10, 8]);
      ctx.beginPath();
      ctx.moveTo(e.x, e.y);
      ctx.lineTo(e.x + e.aimX * 900, e.y + e.aimY * 900);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.scale(e.scale, e.scale);
    const atk = e.state === 'charge' || e.state === 'telegraph';
    if (e.type === 'anubis') {
      ctx.fillStyle = e.flash > 0 ? '#e8b4ff' : (atk ? '#8b3dff' : '#4a3a6a');
      ctx.beginPath();
      ctx.moveTo(0, -36);
      ctx.lineTo(28, 28);
      ctx.lineTo(-28, 28);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#c9a0ff';
      ctx.fillRect(-10, -8, 20, 14);
    } else if (e.type === 'fast') {
      ctx.fillStyle = e.flash > 0 ? '#ffa' : (atk ? '#e6a817' : '#5c4a1a');
      ctx.beginPath();
      ctx.moveTo(18, 0);
      ctx.lineTo(-14, -14);
      ctx.lineTo(-14, 14);
      ctx.closePath();
      ctx.fill();
    } else if (e.type === 'fake') {
      ctx.fillStyle = e.flash > 0 ? '#aaf' : (atk ? '#6688cc' : '#2a3550');
      ctx.fillRect(-16, -18, 32, 36);
      ctx.fillStyle = '#8899bb';
      ctx.fillRect(-6, -24, 12, 8);
    } else {
      ctx.fillStyle = e.flash > 0 ? '#f86' : (atk ? '#c44' : '#3d4450');
      ctx.fillRect(-16, -18, 32, 36);
      ctx.fillStyle = atk ? '#e55' : '#2a3038';
      ctx.fillRect(-26, -6, 10, 14);
      ctx.fillRect(16, -6, 10, 14);
    }
    ctx.restore();
  }

  function drawPlayer() {
    ctx.save();
    if (player.invuln > 0 && ((player.invuln * 18) | 0) % 2 === 0) ctx.globalAlpha = 0.4;
    ctx.fillStyle = player.flash > 0 ? '#ff6b6b' : '#7ec8ff';
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#3a7ca5';
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r * 0.55, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e8f4ff';
    const f = player.facing;
    ctx.beginPath();
    ctx.moveTo(player.x + f * (player.r + 6), player.y);
    ctx.lineTo(player.x + f * (player.r - 2), player.y - 7);
    ctx.lineTo(player.x + f * (player.r - 2), player.y + 7);
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    ctx.save();
    if (shake > 0) {
      const s = shake * 14;
      ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    }
    ctx.fillStyle = '#161b22';
    ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.strokeStyle = '#21262d';
    for (let x = 0; x < W; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    for (const e of enemies) drawEnemy(e);
    drawPlayer();

    if (flashRed > 0) {
      ctx.fillStyle = `rgba(255,40,40,${flashRed * 2})`;
      ctx.fillRect(0, 0, W, H);
    }
    if (flashWhite > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flashWhite * 1.5})`;
      ctx.fillRect(0, 0, W, H);
    }

    if (gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#f85149';
      ctx.font = 'bold 20px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(lastDeath || '실패', W / 2, H / 2 - 8);
      ctx.fillStyle = '#e6edf3';
      ctx.font = '13px system-ui';
      ctx.fillText('R 재도전', W / 2, H / 2 + 18);
    }
    if (cleared) {
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#3fb950';
      ctx.font = 'bold 28px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('CLEAR', W / 2, H / 2);
      ctx.fillStyle = '#e6edf3';
      ctx.font = '13px system-ui';
      ctx.fillText(`${stageTime | 0}s · R 다시`, W / 2, H / 2 + 28);
    }
    ctx.restore();
  }

  let last = performance.now();
  function frame(now) {
    let dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  resetRun();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
