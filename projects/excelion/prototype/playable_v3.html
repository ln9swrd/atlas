<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Excelion Playable V3 — Vertical Slice</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #0d1117; color: #e6edf3; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; }
  h1 { font-size: 0.95rem; margin-bottom: 6px; opacity: 0.9; }
  #wrap { position: relative; width: 800px; max-width: 100%; }
  canvas { display: block; width: 100%; background: #161b22; border: 1px solid #30363d; border-radius: 6px; touch-action: none; }
  #overlay { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 10px 12px; }
  .bars { display: flex; flex-direction: column; gap: 5px; }
  .bar-row { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 0.02em; }
  .bar-bg { flex: 1; height: 9px; background: #21262d; border-radius: 3px; overflow: hidden; border: 1px solid #30363d; }
  .bar-fill { height: 100%; border-radius: 2px; }
  #php { background: linear-gradient(90deg,#2ea043,#3fb950); }
  #bhp { background: linear-gradient(90deg,#da3633,#f85149); }
  #dash { background: linear-gradient(90deg,#1f6feb,#58a6ff); }
  #banner { text-align: center; font-size: 16px; font-weight: 800; text-shadow: 0 2px 8px #000; min-height: 1.5em; letter-spacing: 0.04em; }
  #reason { color: #ff7b72; font-size: 13px; font-weight: 700; text-align: center; min-height: 1.3em; }
  #dbg { font-size: 10px; color: #8b949e; }
  #help { width: 800px; max-width: 100%; margin-top: 8px; font-size: 12px; color: #8b949e; line-height: 1.45; }
  button { margin: 4px 4px 0 0; padding: 6px 12px; background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 4px; cursor: pointer; }
  button:hover { background: #30363d; }
</style>
</head>
<body>
<h1>Excelion · Phase 3 Vertical Slice</h1>
<div id="wrap">
  <canvas id="c" width="800" height="480"></canvas>
  <div id="overlay">
    <div>
      <div class="bars">
        <div class="bar-row"><span>YOU</span><div class="bar-bg"><div class="bar-fill" id="php" style="width:100%"></div></div></div>
        <div class="bar-row"><span id="blabel">—</span><div class="bar-bg"><div class="bar-fill" id="bhp" style="width:0%"></div></div></div>
        <div class="bar-row"><span>DASH</span><div class="bar-bg"><div class="bar-fill" id="dash" style="width:100%"></div></div></div>
      </div>
      <div id="dbg"></div>
    </div>
    <div>
      <div id="banner"></div>
      <div id="reason"></div>
    </div>
  </div>
</div>
<div>
  <button type="button" id="restart">Retry (R)</button>
</div>
<div id="help">
  <b>조작</b> WASD · Space/Shift 대시 · J/클릭 공격<br/>
  <b>흐름</b> Start → Wave1 → Wave2 → Boss → Result → Retry<br/>
  <b>디버그</b> F1 히트박스 · F2 무적 · F3 보스 스킵<br/>
  Fast 0.4s 경고 · Fake 취소 후 0.3s 돌진 · Anubis P2 방향전환 2회+최종
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = 800, H = 480;
  const keys = {};

  // --- audio (dummy oscillators) ---
  let actx = null;
  function ensureAudio() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  }
  function beep(freq, dur, type = 'square', gain = 0.04) {
    try {
      ensureAudio();
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.value = gain;
      o.connect(g); g.connect(actx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      o.stop(actx.currentTime + dur);
    } catch (_) {}
  }
  const sfx = {
    dash: () => beep(180, 0.08, 'sawtooth', 0.03),
    hit: () => beep(120, 0.06, 'square', 0.05),
    hurt: () => beep(80, 0.12, 'sawtooth', 0.06),
    charge: () => beep(55, 0.2, 'triangle', 0.05),
    clear: () => { beep(440, 0.1); setTimeout(() => beep(660, 0.15), 100); },
    warn: () => beep(320, 0.05, 'sine', 0.03),
  };

  // --- state ---
  let shake = 0, hitstop = 0, flashRed = 0, flashWhite = 0, bossTint = 0;
  let bannerT = 0, bannerText = '';
  let gameOver = false, cleared = false, started = false;
  let lastDeath = '';
  let wave = 0;
  let enemies = [];
  let stageTime = 0;
  let hitsTaken = 0;
  let debugHB = false, debugGod = false;

  const INVULN_DASH = 0.30;
  const DASH_DUR = 0.28;
  const DASH_CD = 0.85;

  const player = {
    x: 180, y: H / 2, r: 14, hp: 100, maxHp: 100,
    speed: 230, dashT: 0, dashCd: 0, invuln: 0, facing: 1, flash: 0,
  };

  function showBanner(t, sec = 1.5) {
    bannerText = t;
    bannerT = sec;
    document.getElementById('banner').textContent = t;
  }

  function setReason(t) {
    lastDeath = t;
    document.getElementById('reason').textContent = t || '';
  }

  function makeEnemy(type, x, y) {
    const hp = type === 'anubis' ? 300 : type === 'montu' ? 50 : 42;
    return {
      type, x, y,
      r: type === 'anubis' ? 32 : 20,
      hp, maxHp: hp,
      state: 'idle',
      timer: 0.5 + Math.random() * 0.4,
      aimX: 1, aimY: 0,
      vx: 0, vy: 0,
      scale: 1, flash: 0,
      chargeCount: 0,
      comboLeft: 0,
      redirectLeft: 0,
      phase: 1,
      alive: true,
      speedMul: 1,
    };
  }

  function spawnWave(n) {
    enemies = [];
    if (n === 1) {
      showBanner('WAVE 1');
      sfx.warn();
      enemies = [
        makeEnemy('montu', 600, 150),
        makeEnemy('montu', 680, 240),
        makeEnemy('montu', 600, 350),
      ];
    } else if (n === 2) {
      showBanner('WAVE 2 — READ THE FAKE');
      sfx.warn();
      enemies = [
        makeEnemy('fast', 640, 170),
        makeEnemy('fake', 700, 300),
        makeEnemy('montu', 580, 260),
      ];
    } else if (n === 3) {
      showBanner('⚠ BOSS — ANUBIS');
      sfx.charge();
      enemies = [makeEnemy('anubis', 640, H / 2)];
    }
  }

  function startGame() {
    gameOver = false;
    cleared = false;
    started = true;
    setReason('');
    player.x = 180; player.y = H / 2; player.hp = 100;
    player.dashT = player.dashCd = player.invuln = 0;
    wave = 1;
    stageTime = 0;
    hitsTaken = 0;
    spawnWave(1);
    updateUI();
  }

  function updateUI() {
    document.getElementById('php').style.width = `${Math.max(0, player.hp)}%`;
    const alive = enemies.filter(e => e.alive);
    const focus = alive.find(e => e.type === 'anubis') || alive[0];
    if (focus) {
      document.getElementById('blabel').textContent = focus.type === 'anubis' ? `ANUBIS P${focus.phase}` : focus.type.toUpperCase();
      document.getElementById('bhp').style.width = `${(100 * focus.hp) / focus.maxHp}%`;
    } else {
      document.getElementById('blabel').textContent = '—';
      document.getElementById('bhp').style.width = '0%';
    }
    const dashPct = player.dashCd <= 0 ? 100 : Math.max(0, 100 * (1 - player.dashCd / DASH_CD));
    document.getElementById('dash').style.width = `${dashPct}%`;
    document.getElementById('dbg').textContent =
      `F1 HB:${debugHB ? 'ON' : 'off'} · F2 GOD:${debugGod || player.invuln > 0 ? 'ON' : 'off'} · F3 skip · hits:${hitsTaken}`;
  }

  function classifyDodgeFail(e) {
    // approximate: if player dashed very recently ended vs never
    if (player.dashCd > DASH_CD - 0.15) return 'TOO EARLY DODGE';
    if (player.dashT <= 0 && player.dashCd < 0.4) return 'TOO LATE';
    if (e.type === 'fake') return 'FAKE READ FAIL';
    if (e.comboLeft > 0 || e.redirectLeft > 0) return 'COMBO POSITION FAIL';
    return 'TOO LATE';
  }

  function die(reason) {
    if (gameOver || cleared) return;
    gameOver = true;
    setReason(reason || 'YOU DIED');
    document.getElementById('banner').textContent = 'YOU DIED';
  }

  function hitPlayer(dmg, e) {
    if (debugGod || player.invuln > 0 || gameOver || cleared) return;
    player.hp -= dmg;
    hitsTaken++;
    player.flash = 0.12;
    flashRed = 0.14;
    shake = 0.22;
    hitstop = 0.1;
    sfx.hurt();
    const reason = classifyDodgeFail(e);
    if (player.hp <= 0) die(reason);
    else setReason(reason);
    updateUI();
  }

  function damageEnemy(e, dmg) {
    if (!e.alive) return;
    e.hp -= dmg;
    e.flash = 0.1;
    e.scale = 0.88;
    flashWhite = 0.05;
    hitstop = 0.05;
    shake = e.type === 'anubis' ? 0.18 : 0.1;
    sfx.hit();
    if (e.type === 'anubis') bossTint = 0.08;
    if (e.hp <= 0) { e.alive = false; e.state = 'dead'; }
    updateUI();
  }

  function tryDash() {
    if (gameOver || cleared || !started || player.dashCd > 0 || player.dashT > 0) return;
    player.dashT = DASH_DUR;
    player.invuln = INVULN_DASH;
    player.dashCd = DASH_CD;
    sfx.dash();
  }

  function playerAttack() {
    if (gameOver || cleared || !started) return;
    for (const e of enemies) {
      if (!e.alive) continue;
      const dx = e.x - player.x, dy = e.y - player.y;
      if (dx * dx + dy * dy < (player.r + e.r + 22) ** 2) {
        damageEnemy(e, e.type === 'anubis' ? 11 : 17);
      }
    }
  }

  function aimAtPlayer(e) {
    const dx = player.x - e.x, dy = player.y - e.y;
    const len = Math.hypot(dx, dy) || 1;
    e.aimX = dx / len;
    e.aimY = dy / len;
  }

  function startCharge(e, duration, speed) {
    e.state = 'charge';
    e.timer = duration;
    e.vx = e.aimX * speed;
    e.vy = e.aimY * speed;
    e.scale = 1.15;
    sfx.charge();
  }

  function updateEnemy(e, dt) {
    if (!e.alive) return;
    e.timer -= dt;
    if (e.flash > 0) e.flash -= dt;
    if (e.scale < 1) e.scale = Math.min(1, e.scale + dt * 2.5);

    if (e.type === 'anubis') {
      e.phase = e.hp <= e.maxHp * 0.5 ? 2 : 1;
      e.speedMul = e.phase === 2 ? (1.2 + Math.random() * 0.05) : 1;
    }

    if (e.state === 'idle') {
      if (e.timer <= 0) {
        if (e.type === 'fake') {
          e.state = 'fake_paint';
          e.timer = 0.4;
          aimAtPlayer(e);
          sfx.warn();
        } else if (e.type === 'anubis' && e.phase === 2) {
          // P2: redirects then final
          e.state = 'telegraph';
          e.timer = 0.45;
          aimAtPlayer(e);
          e.redirectLeft = 2;
          e.comboLeft = 0;
          sfx.warn();
        } else if (e.type === 'anubis' && e.chargeCount % 2 === 1) {
          e.state = 'telegraph';
          e.timer = 0.55;
          aimAtPlayer(e);
          e.comboLeft = 3;
          e.redirectLeft = 0;
          sfx.warn();
        } else {
          e.state = 'telegraph';
          const tel = e.type === 'fast' ? 0.4 : e.type === 'anubis' ? 0.65 : 0.8;
          e.timer = tel;
          aimAtPlayer(e);
          e.comboLeft = 0;
          e.redirectLeft = 0;
          sfx.warn();
        }
      }
    } else if (e.state === 'fake_paint') {
      // visible cancel: line fades conceptually by state change
      if (e.timer <= 0) {
        e.state = 'fake_cancel';
        e.timer = 0.3;
      }
    } else if (e.state === 'fake_cancel') {
      if (e.timer <= 0) {
        aimAtPlayer(e);
        e.state = 'telegraph';
        e.timer = 0.22;
        sfx.warn();
      }
    } else if (e.state === 'telegraph') {
      if (e.timer <= 0) {
        let spd = e.type === 'fast' ? 640 : e.type === 'anubis' ? 540 : 500;
        if (e.type === 'anubis' && e.phase === 2) {
          spd *= 1.2 + Math.random() * 0.2;
        }
        const dur = e.type === 'anubis' ? 0.4 : 0.48;
        startCharge(e, dur, spd);
      }
    } else if (e.state === 'charge') {
      e.x += e.vx * dt;
      e.y += e.vy * dt;
      const dx = player.x - e.x, dy = player.y - e.y;
      if (dx * dx + dy * dy < (player.r + e.r) ** 2) {
        hitPlayer(e.type === 'anubis' ? 30 : 22, e);
        if (e.type === 'anubis') { shake = 0.35; bossTint = 0.15; hitstop = 0.12; }
      }
      const m = e.r + 6;
      const hitWall = e.x < m || e.x > W - m || e.y < m || e.y > H - m;
      if (hitWall || e.timer <= 0) {
        e.x = Math.max(m, Math.min(W - m, e.x));
        e.y = Math.max(m, Math.min(H - m, e.y));
        e.vx = e.vy = 0;
        e.scale = 1;
        e.chargeCount++;
        if (e.type === 'anubis' && e.redirectLeft > 0) {
          e.redirectLeft--;
          aimAtPlayer(e);
          e.state = 'telegraph';
          e.timer = 0.22;
        } else if (e.type === 'anubis' && e.comboLeft > 1) {
          e.comboLeft--;
          aimAtPlayer(e);
          e.state = 'telegraph';
          e.timer = 0.26;
        } else {
          e.comboLeft = 0;
          e.redirectLeft = 0;
          e.state = 'recover';
          e.timer = e.type === 'anubis' ? 0.5 : 0.6;
        }
      }
    } else if (e.state === 'recover') {
      if (e.timer <= 0) {
        e.state = 'idle';
        e.timer = 0.3 + Math.random() * 0.35;
      }
    }
  }

  function checkWaveClear() {
    if (gameOver || cleared || !started) return;
    if (enemies.length && enemies.every(e => !e.alive)) {
      if (wave === 1) { wave = 2; spawnWave(2); }
      else if (wave === 2) { wave = 3; spawnWave(3); }
      else if (wave === 3) {
        wave = 4;
        cleared = true;
        sfx.clear();
        showBanner('CLEAR', 99);
        setReason(`TIME ${stageTime | 0}s · HITS ${hitsTaken}`);
      }
    }
  }

  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    ensureAudio();
    if (e.code === 'KeyR') startGame();
    if (e.code === 'KeyJ' || e.code === 'KeyZ') playerAttack();
    if (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
      e.preventDefault();
      tryDash();
    }
    if (e.code === 'F1') { e.preventDefault(); debugHB = !debugHB; updateUI(); }
    if (e.code === 'F2') { e.preventDefault(); debugGod = !debugGod; updateUI(); }
    if (e.code === 'F3') {
      e.preventDefault();
      if (wave < 3) { wave = 3; spawnWave(3); }
      else if (enemies[0]) { enemies[0].hp = 0; enemies[0].alive = false; checkWaveClear(); }
    }
  });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });
  canvas.addEventListener('mousedown', () => { ensureAudio(); playerAttack(); });
  document.getElementById('restart').onclick = () => startGame();

  function update(dt) {
    if (hitstop > 0) { hitstop -= dt; return; }
    if (shake > 0) shake -= dt;
    if (flashRed > 0) flashRed -= dt;
    if (flashWhite > 0) flashWhite -= dt;
    if (bossTint > 0) bossTint -= dt;
    if (bannerT > 0 && bannerT < 90) {
      bannerT -= dt;
      if (bannerT <= 0 && !cleared && !gameOver) document.getElementById('banner').textContent = '';
    }

    if (!started) return;
    if (gameOver || cleared) return;
    stageTime += dt;

    let mx = 0, my = 0;
    if (keys['KeyW'] || keys['ArrowUp']) my -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) my += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
    if (mx || my) {
      const len = Math.hypot(mx, my);
      mx /= len; my /= len;
      player.facing = mx >= 0 ? 1 : -1;
      const sp = player.speed * (player.dashT > 0 ? 2.5 : 1);
      player.x += mx * sp * dt;
      player.y += my * sp * dt;
    }
    player.x = Math.max(player.r, Math.min(W - player.r, player.x));
    player.y = Math.max(player.r, Math.min(H - player.r, player.y));
    if (player.dashT > 0) player.dashT -= dt;
    if (player.dashCd > 0) player.dashCd -= dt;
    if (player.invuln > 0) player.invuln -= dt;
    if (player.flash > 0) player.flash -= dt;

    for (const e of enemies) updateEnemy(e, dt);
    checkWaveClear();
    updateUI();
  }

  function drawEnemy(e) {
    if (!e.alive) return;
    if (e.state === 'telegraph' || e.state === 'fake_paint') {
      const col = e.state === 'fake_paint' ? 'rgba(160,170,255,0.55)' : 'rgba(255,200,40,0.92)';
      ctx.strokeStyle = col;
      ctx.lineWidth = e.type === 'fast' ? 3 : 4;
      ctx.setLineDash(e.state === 'fake_paint' ? [5, 12] : [10, 8]);
      ctx.beginPath();
      ctx.moveTo(e.x, e.y);
      ctx.lineTo(e.x + e.aimX * 900, e.y + e.aimY * 900);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    // cancel state: brief dim (player sees "속았다")
    if (e.state === 'fake_cancel') {
      ctx.fillStyle = 'rgba(100,120,180,0.15)';
      ctx.beginPath();
      ctx.arc(e.x, e.y, 50, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.scale(e.scale, e.scale);
    const atk = e.state === 'charge' || e.state === 'telegraph';
    if (e.type === 'anubis') {
      ctx.fillStyle = e.flash > 0 ? '#f0d0ff' : (atk ? '#9b4dff' : '#4a3a6a');
      ctx.beginPath();
      ctx.moveTo(0, -36); ctx.lineTo(28, 28); ctx.lineTo(-28, 28);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#c9a0ff';
      ctx.fillRect(-10, -8, 20, 14);
    } else if (e.type === 'fast') {
      ctx.fillStyle = e.flash > 0 ? '#ffe08a' : (atk ? '#e6a817' : '#5c4a1a');
      ctx.beginPath();
      ctx.moveTo(18, 0); ctx.lineTo(-14, -14); ctx.lineTo(-14, 14);
      ctx.closePath(); ctx.fill();
    } else if (e.type === 'fake') {
      ctx.fillStyle = e.flash > 0 ? '#cce' : (atk ? '#6688cc' : '#2a3550');
      ctx.fillRect(-16, -18, 32, 36);
      ctx.fillStyle = '#8899bb';
      ctx.fillRect(-6, -24, 12, 8);
    } else {
      ctx.fillStyle = e.flash > 0 ? '#f86' : (atk ? '#c44' : '#3d4450');
      ctx.fillRect(-16, -18, 32, 36);
      ctx.fillStyle = atk ? '#e55' : '#2a3038';
      ctx.fillRect(-26, -6, 10, 14);
      ctx.fillRect(16, -6, 10, 14);
    }
    ctx.restore();
    if (debugHB) {
      ctx.strokeStyle = '#0f0';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawPlayer() {
    ctx.save();
    if (player.invuln > 0 && ((player.invuln * 18) | 0) % 2 === 0) ctx.globalAlpha = 0.4;
    ctx.fillStyle = player.flash > 0 ? '#ff6b6b' : '#7ec8ff';
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#3a7ca5';
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r * 0.55, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e8f4ff';
    const f = player.facing;
    ctx.beginPath();
    ctx.moveTo(player.x + f * (player.r + 6), player.y);
    ctx.lineTo(player.x + f * (player.r - 2), player.y - 7);
    ctx.lineTo(player.x + f * (player.r - 2), player.y + 7);
    ctx.fill();
    // invuln ring
    if (player.invuln > 0) {
      ctx.strokeStyle = 'rgba(88,166,255,0.7)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.r + 5, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
    if (debugHB) {
      ctx.strokeStyle = '#0ff';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawResult() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    if (cleared) {
      ctx.fillStyle = '#3fb950';
      ctx.font = 'bold 32px system-ui';
      ctx.fillText('CLEAR', W / 2, H / 2 - 36);
      ctx.fillStyle = '#e6edf3';
      ctx.font = '15px system-ui';
      ctx.fillText(`Time  ${stageTime | 0}s`, W / 2, H / 2);
      ctx.fillText(`Hits taken  ${hitsTaken}`, W / 2, H / 2 + 24);
      ctx.fillStyle = '#8b949e';
      ctx.font = '13px system-ui';
      ctx.fillText('R — Retry', W / 2, H / 2 + 56);
    } else if (gameOver) {
      ctx.fillStyle = '#f85149';
      ctx.font = 'bold 28px system-ui';
      ctx.fillText('YOU DIED', W / 2, H / 2 - 28);
      ctx.fillStyle = '#ff7b72';
      ctx.font = '14px system-ui';
      ctx.fillText(lastDeath, W / 2, H / 2 + 4);
      ctx.fillStyle = '#8b949e';
      ctx.fillText('R — Retry', W / 2, H / 2 + 36);
    }
  }

  function draw() {
    ctx.save();
    if (shake > 0) {
      const s = shake * 16;
      ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    }
    ctx.fillStyle = '#161b22';
    ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.strokeStyle = '#21262d';
    for (let x = 0; x < W; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    if (!started) {
      ctx.fillStyle = '#e6edf3';
      ctx.font = 'bold 22px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('EXCELION  V3', W / 2, H / 2 - 20);
      ctx.font = '14px system-ui';
      ctx.fillStyle = '#8b949e';
      ctx.fillText('Press R to Start', W / 2, H / 2 + 16);
      ctx.restore();
      return;
    }
    for (const e of enemies) drawEnemy(e);
    drawPlayer();
    if (flashRed > 0) {
      ctx.fillStyle = `rgba(255,40,40,${Math.min(0.45, flashRed * 2.2)})`;
      ctx.fillRect(0, 0, W, H);
    }
    if (flashWhite > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flashWhite * 1.4})`;
      ctx.fillRect(0, 0, W, H);
    }
    if (bossTint > 0) {
      ctx.fillStyle = `rgba(120,40,180,${bossTint})`;
      ctx.fillRect(0, 0, W, H);
    }
    if (gameOver || cleared) drawResult();
    ctx.restore();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  updateUI();
  showBanner('PRESS R TO START', 99);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
