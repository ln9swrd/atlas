# Pyrefly type checker configuration for Excelion Forge
#
# bpy is a Blender-internal module not available in the standard Python
# environment. We use a minimal stub (typestubs/bpy/) for type information
# and ignore the missing-import error for the module itself.
#
# Keys are top-level (no section header) — pyrefly.toml format.

# Blender runtime modules — not resolvable in the standard Python environment.
# Suppress missing-import errors; type stubs in typestubs/ provide IDE assistance.
ignore-missing-imports = ["bpy", "bmesh", "mathutils", "bl_ui", "bl_operators"]

# Add typestubs/ so Pyrefly can resolve bpy stubs.
search-path = ["typestubs"]

# Python interpreter — Local virtualenv path (uncomment if custom path is required)
# python-interpreter-path = ".venv/Scripts/python.exe"

# Include only the addon source and tests.
project-includes = ["excelion_forge", "tests"]

# Exclude generated/cache directories.
project-excludes = [
    "**/__pycache__",
    "**/*.pyc",
    ".git",
    ".venv",
    "typestubs",
]
