name: Auto Merge PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["Atlas CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub PR Auto-Merge
        if: github.event_name == 'pull_request_target'
        run: |
          gh pr merge "${PR_URL}" --auto --squash --delete-branch || echo "Ensure 'Allow auto-merge' is enabled in repo settings."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Direct Merge on CI Success
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        run: |
          PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number }}"
          if [ -n "$PR_NUMBER" ]; then
            echo "CI passed for PR #$PR_NUMBER. Attempting auto-merge..."
            gh pr merge "$PR_NUMBER" --squash --delete-branch || echo "PR #$PR_NUMBER auto-merge skipped or failed."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
