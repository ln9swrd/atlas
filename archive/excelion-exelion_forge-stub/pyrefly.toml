# Pyrefly configuration file

[project]
name = "exelion-forge"
version = "0.1.0"
description = "Exelion 제작을 위한 파라미터 기반 캐릭터 생성기"

[tool.pyrefly]
# 자동화 설정
auto_format = true
auto_lint = true
auto_test = true

# 테스트 설정
test_command = "pytest"
test_coverage = 80

# 빌드 설정
build_command = "python -m build"
build_output_dir = "dist"

# 문서화 설정
docs_command = "sphinx-build"
docs_source_dir = "docs"
docs_output_dir = "build/docs"