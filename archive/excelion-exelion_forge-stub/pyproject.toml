[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exelion-forge"
version = "0.1.0"
description = "Exelion 제작을 위한 파라미터 기반 캐릭터 생성기"
readme = "README.md"
authors = [
    {name = "Atlas Team", email = "atlas@team.com"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "blender",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black",
    "flake8",
]

[project.urls]
Homepage = "https://github.com/ln9swrd/atlas"
Repository = "https://github.com/ln9swrd/atlas"
Documentation = "https://github.com/ln9swrd/atlas/blob/main/projects/exelion-forge/README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["exelion_forge*"]